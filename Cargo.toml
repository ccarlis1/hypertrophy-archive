[package]
name = "hypertrophy_archive"
version = "0.1.0"
edition = "2024"
default-run = "hypertrophy_archive"

[[bin]]
name = "hypertrophy_archive"
path = "src/main.rs"

[[bin]]
name = "ha"
path = "src/bin/ha.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = "0.22.0"  # egui framework
egui = "0.22.0"    # immediate mode GUI
rfd = "0.11.0"     # file dialog
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
directories = "5"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winuser", "windef", "wingdi", "shellapi", "libloaderapi"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[package.metadata.winres]
OriginalFilename = "hypertrophy_archive.exe"
FileDescription = "Hypertrophy Exercise Archive"
ProductName = "Hypertrophy Archive"
